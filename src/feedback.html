
<!DOCTYPE html>

</head>
<body>
    <header class="site-header">
        <div class="container navbar">
            <a class="brand" href="index.html" aria-label="Campus Bites home">
                <span class="brand-icon">CB</span>
                <span class="brand-text">Campus Bites<small>Fresh food. Campus energy.</small></span>
            </a>

            <nav class="nav-links" aria-label="Main navigation">
                <a href="index.html" >Home</a>
                <a href="menu.html">Menu</a>
		<a href="deals.html">Deals</a>
        <a href="order.html">Order</a>

        <a href="feedback.html" class="active" aria-current="page">Feedback & Contact</a>
            </nav>

        </div>
    </header>
    <main>
        <section class="contact">
            <h2>Contact Us</h2>
            <p>Have a question? Get in touch with our cafeteria team.</p>
            <p>Email: cafeteria@example.com</p>
            <p>Location: Campus Cafeteria</p>
        </section>

        <section class="feedback">
            <h2>Share Your Feedback</h2>

            <form>
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Your Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Submit Feedback</button>
            </form>
        </section>
    </main>
</body>
</html>
