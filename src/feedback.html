
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback & Contact | Campus Cafeteria</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <header>
        <link rel="stylesheet" href="../styles/style.css">
        <h1>Campus Cafeteria</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="feedback.html">Feedback & Contact</a>
        </nav>
    </header>

    <main>
        <section class="contact">
            <h2>Contact Us</h2>
            <p>Have a question? Get in touch with our cafeteria team.</p>
            <p>Email: cafeteria@example.com</p>
            <p>Location: Campus Cafeteria</p>
        </section>

        <section class="feedback">
            <h2>Share Your Feedback</h2>

            <form>
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Your Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Submit Feedback</button>
            </form>
        </section>
    </main>
</body>
</html>
